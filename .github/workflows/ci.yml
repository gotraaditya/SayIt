name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend test dependencies
        shell: pwsh
        run: |
          python -m venv python-backend\venv
          python-backend\venv\Scripts\python.exe -m pip install --require-hashes -r python-backend\release-tools-requirements.lock.txt
          python-backend\venv\Scripts\python.exe -m pip install --require-hashes -r python-backend\packaging-requirements.lock.txt
          python-backend\venv\Scripts\python.exe -m pip install --no-cache-dir --no-build-isolation --require-hashes -r python-backend\requirements.lock.txt

      - name: Install Rust release tools
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/install-rust-release-tools.ps1

      - name: Frontend tests
        run: npm test -- --run

      - name: Frontend production build
        run: npm run build:frontend

      - name: Backend tests
        shell: pwsh
        run: python-backend\venv\Scripts\python.exe -m unittest discover -s python-backend -p "test_*.py"

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Security audits
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/audit-security.ps1

      - name: Build release sidecar assets
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-python-sidecar.ps1

      - name: Verify release assets
        run: npm run verify:release-assets

      - name: Test release scripts
        run: npm run test:release-scripts

      - name: Generate SBOM
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/generate-sbom.ps1
