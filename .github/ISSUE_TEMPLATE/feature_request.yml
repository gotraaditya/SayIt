name: Feature request
description: Suggest an improvement to SayIt.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this change solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This proposal preserves SayIt's local-first handling of selected text, or explains any privacy impact above.
          required: true
